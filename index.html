<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מעקב קלוריות</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #222; direction: rtl; }

    /* ---------- Loading overlay ---------- */
    #loadingOverlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #2d6a4f; z-index: 100;
    }

    /* ---------- Auth screen ---------- */
    #authScreen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: white; border-radius: 16px;
      padding: 32px 24px; width: 100%; max-width: 360px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      display: flex; flex-direction: column; gap: 14px;
    }
    .auth-card h1 { text-align: center; color: #2d6a4f; font-size: 1.5rem; margin-bottom: 4px; }
    .auth-card p  { text-align: center; color: #888; font-size: 0.9rem; }
    .auth-card input {
      padding: 12px 14px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 1rem; width: 100%; direction: ltr; text-align: left;
    }
    .auth-card input:focus { outline: none; border-color: #2d6a4f; }
    .btn-signin {
      background: #2d6a4f; color: white; border: none; border-radius: 8px;
      padding: 13px; font-size: 1rem; cursor: pointer; font-weight: 700;
    }
    .btn-signup {
      background: white; color: #2d6a4f; border: 2px solid #2d6a4f; border-radius: 8px;
      padding: 11px; font-size: 1rem; cursor: pointer; font-weight: 700;
    }
    .btn-signin:active { background: #1b4332; }
    .btn-signup:active { background: #e8f5e9; }
    #authError   { color: #e53935; font-size: 0.88rem; text-align: center; min-height: 18px; }
    #authSuccess { color: #2d6a4f; font-size: 0.88rem; text-align: center; min-height: 18px; }

    /* ---------- App: header ---------- */
    header { background: #2d6a4f; color: white; padding: 14px 20px 14px; }
    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    #userEmail { font-size: 0.72rem; opacity: 0.75; direction: ltr; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-logout {
      background: rgba(255,255,255,0.18); color: white;
      border: 1px solid rgba(255,255,255,0.35); border-radius: 6px;
      padding: 4px 10px; font-size: 0.8rem; cursor: pointer;
    }
    .target-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .target-row label { font-size: 0.95rem; }
    .target-row input { width: 80px; padding: 6px 8px; font-size: 1rem; border: none; border-radius: 6px; text-align: center; }

    /* ---------- Date corner (upper right in header) ---------- */
    .date-corner {
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px; padding: 6px 10px;
    }
    .date-corner .date-label { font-size: 0.82rem; font-weight: 700; white-space: nowrap; }
    .btn-change-date {
      background: rgba(255,255,255,0.25); color: white;
      border: 1px solid rgba(255,255,255,0.5); border-radius: 6px;
      padding: 3px 8px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
    }
    .btn-change-date:active { background: rgba(255,255,255,0.4); }

    /* ---------- Unsaved changes modal ---------- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .modal-card {
      background: white; border-radius: 14px;
      padding: 24px 20px; width: 100%; max-width: 340px;
      display: flex; flex-direction: column; gap: 12px;
      text-align: center;
    }
    .modal-card p { font-size: 1rem; line-height: 1.5; color: #222; }
    .modal-btn-save     { background: #2d6a4f; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 0.95rem; cursor: pointer; font-weight: 700; }
    .modal-btn-skip     { background: white; color: #555; border: 1px solid #ccc; border-radius: 8px; padding: 11px; font-size: 0.95rem; cursor: pointer; }
    .modal-btn-cancel   { background: white; color: #e53935; border: 1px solid #e53935; border-radius: 8px; padding: 11px; font-size: 0.95rem; cursor: pointer; }

    /* ---------- Summary bar ---------- */
    .summary-bar {
      background: #1b4332; color: white;
      display: flex; justify-content: space-around;
      padding: 10px 20px; font-size: 0.95rem; flex-wrap: wrap; gap: 6px;
    }
    .summary-bar span { font-weight: 600; }
    .summary-bar .remaining.negative { color: #f28b82; }

    /* ---------- Main content ---------- */
    main { max-width: 600px; margin: 0 auto; padding: 16px 12px 100px; }
    section {
      background: white; border-radius: 12px; padding: 16px;
      margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    section h2 {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
      color: #2d6a4f; border-bottom: 2px solid #e8f5e9; padding-bottom: 8px;
    }

    /* ---------- Food rows ---------- */
    .food-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #f0f0f0; }
    .food-item:last-child { border-bottom: none; }
    .food-item input[type="checkbox"] { width: 26px; height: 26px; accent-color: #2d6a4f; cursor: pointer; flex-shrink: 0; }
    .food-item .name { flex: 1; font-size: 0.95rem; }
    .food-item .cal-badge { font-size: 0.82rem; color: #666; white-space: nowrap; }
    .food-item input[type="number"] { width: 62px; padding: 5px 4px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
    .food-item input[type="number"]:focus { outline: none; border-color: #2d6a4f; }
    .food-item.unchecked .name,
    .food-item.unchecked .cal-badge { opacity: 0.45; }

    /* ---------- Custom item form ---------- */
    .custom-form { display: flex; flex-direction: column; gap: 10px; }
    .custom-form input[type="text"],
    .custom-form input[type="number"] {
      padding: 10px 12px; font-size: 1rem;
      border: 1px solid #ccc; border-radius: 8px; width: 100%; direction: rtl;
    }
    .custom-form input:focus { outline: none; border-color: #2d6a4f; }
    .btn-add { background: #2d6a4f; color: white; border: none; border-radius: 8px; padding: 11px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-add:active { background: #1b4332; }

    /* ---------- Action buttons ---------- */
    .actions-section { display: flex; flex-direction: column; gap: 10px; }

    .btn-save {
      display: block; width: 100%;
      background: #2d6a4f; color: white;
      border: none; border-radius: 10px; padding: 14px;
      font-size: 1.05rem; cursor: pointer; font-weight: 700;
    }
    .btn-save:disabled { opacity: 0.6; cursor: default; }
    .btn-save:not(:disabled):active { background: #1b4332; }

    .btn-finalize {
      display: block; width: 100%;
      background: #1565c0; color: white;
      border: none; border-radius: 10px; padding: 14px;
      font-size: 1rem; cursor: pointer; font-weight: 700; line-height: 1.4;
    }
    .btn-finalize:disabled { opacity: 0.6; cursor: default; }
    .btn-finalize:not(:disabled):active { background: #0d47a1; }

    .btn-reset {
      display: block; width: 100%;
      background: white; color: #e53935;
      border: 2px solid #e53935; border-radius: 10px; padding: 12px;
      font-size: 0.95rem; cursor: pointer; font-weight: 700;
    }
    .btn-reset:active { background: #fdecea; }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loadingOverlay">טוען...</div>

<!-- ==================== AUTH SCREEN ==================== -->
<div id="authScreen" style="display:none">
  <div class="auth-card">
    <h1>מעקב קלוריות</h1>
    <p>התחבר כדי לשמור את הנתונים שלך</p>
    <input type="email"    id="emailInput"    placeholder="אימייל"  autocomplete="email" />
    <input type="password" id="passwordInput" placeholder="סיסמה" autocomplete="current-password" />
    <div id="authError"></div>
    <div id="authSuccess"></div>
    <button class="btn-signin" onclick="signIn()">התחברות</button>
    <button class="btn-signup" onclick="signUp()">הרשמה</button>
  </div>
</div>

<!-- ==================== APP SCREEN ==================== -->
<div id="appScreen" style="display:none">

  <header>
    <div class="header-top">
      <div style="flex:1"></div>
      <h1 style="flex:1;text-align:center;">מערכת לניהול קלוריות</h1>
      <div class="header-right" style="flex:1">
        <div class="date-corner">
          <span class="date-label">התאריך הפעיל: <span id="activeDateDisplay">—</span></span>
          <button class="btn-change-date" onclick="openDatePicker()">להחלפת תאריך לחץ כאן</button>
          <input type="date" id="datePicker" style="display:none" onchange="onDatePickerChange(this.value)" />
        </div>
        <span id="userEmail"></span>
        <button class="btn-logout" onclick="signOut()">התנתקות</button>
      </div>
    </div>
    <div class="target-row">
      <label>מאזן קלורי:</label>
      <span id="remainingDisplay" class="remaining" style="background:white;color:#2d6a4f;font-size:1rem;font-weight:700;padding:5px 12px;border-radius:6px;min-width:60px;text-align:center;display:inline-block;">2300</span>
    </div>
  </header>

  <div class="summary-bar">
    <div>קלוריות שנצרכו: <span id="totalDisplay">0</span></div>
    <div>סף קלורי יומי: <input type="number" id="targetInput" value="2300" min="0" oninput="onTargetChange()" style="width:70px;padding:3px 6px;font-size:0.95rem;border:1px solid rgba(255,255,255,0.4);border-radius:6px;text-align:center;background:transparent;color:white;" /></div>
  </div>

  <main>
    <section>
      <h2>רשימת מזון</h2>
      <div id="foodList"></div>
    </section>

    <section>
      <h2>הוספת פריט מותאם</h2>
      <div class="custom-form">
        <input type="text"   id="customName" placeholder="שם הפריט" />
        <input type="number" id="customCal"  placeholder="קלוריות" min="0" />
        <button class="btn-add" onclick="addCustomItem()">הוסף</button>
      </div>
    </section>

    <section>
      <div class="actions-section">
        <button id="btnSave"     class="btn-save"     onclick="saveProgress()">שמור</button>
        <button id="btnFinalize" class="btn-finalize" onclick="finalizeDay()">סיימתי להיום, עבור ליום הבא</button>
        <button                  class="btn-reset"    onclick="resetDay()">אפס יום</button>
      </div>
    </section>
  </main>

  <!-- Unsaved changes modal (date switch) -->
  <div id="unsavedModal" style="display:none">
    <div class="modal-overlay">
      <div class="modal-card">
        <p>יש לך שינויים שלא נשמרו.<br>האם לשמור לפני מעבר תאריך?</p>
        <button class="modal-btn-save"   onclick="modalRespond('save')">שמור ועבור</button>
        <button class="modal-btn-skip"   onclick="modalRespond('skip')">עבור בלי לשמור</button>
        <button class="modal-btn-cancel" onclick="modalRespond('cancel')">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Finalize modal — unsaved changes variant -->
  <div id="finalizeModal" style="display:none">
    <div class="modal-overlay">
      <div class="modal-card">
        <p>יש שינויים שלא נשמרו.<br>לסיים את היום?</p>
        <button class="modal-btn-save"   onclick="finalizeModalRespond('save')">שמור וסיים</button>
        <button class="modal-btn-skip"   onclick="finalizeModalRespond('skip')">סיים בלי לשמור</button>
        <button class="modal-btn-cancel" onclick="finalizeModalRespond('cancel')">ביטול</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>

  // ─── Init Supabase ───────────────────────────────────────────
  if (!window.supabase) {
    document.getElementById('loadingOverlay').textContent = 'שגיאה: לא ניתן לטעון את Supabase. בדוק חיבור לאינטרנט.';
    throw new Error('Supabase CDN not loaded');
  }
  const { createClient } = window.supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser        = null;
  let activeTrackingDate = null;   // loaded from user_tracking_state
  let todayEntries       = {};     // { food_name: entry_row }
  let targetSaveTimer    = null;
  let savedSnapshot      = '{}';   // JSON snapshot of last saved/loaded state
  let modalResolve         = null;  // resolves the date-switch unsaved modal
  let finalizeModalResolve = null;  // resolves the finalize unsaved modal

  // ─── Predefined food list ────────────────────────────────────
  const foods = [
    { name: "3 ביצים",              cal: 210 },
    { name: "לחמניה",               cal: 180 },
    { name: "בננה",                 cal: 100 },
    { name: "קופסאת קוטג",          cal: 230 },
    { name: "תפוח",                 cal: 100 },
    { name: "חזה עוף בגרמים",        cal: 1.6 },
    { name: "200 גרם קציצות בקר",   cal: 500 },
    { name: "200 גרם אורז",         cal: 260 },
    { name: "170 גרם פסטה",         cal: 260 },
    { name: "כף קטשופ",             cal: 20  },
    { name: "מעדן חלבון",           cal: 120 },
    { name: "100 גרם דג",           cal: 125 },
    { name: "חצי בתנור",            cal: 50  },
    { name: "שניצל מאמא עוף",       cal: 240 },
    { name: "פרוסת לזניה",          cal: 320 },
    { name: "קופסת טונה במים",       cal: 120 },
    { name: "קופסת טונה בשמן",       cal: 220 },
    { name: "קערה קורנפלקס דודיק",   cal: 350 },
  ];

  // ─── Date helpers ─────────────────────────────────────────────
  function getRealToday() {
    // Real calendar date — used ONLY when initializing a brand-new user
    return new Date().toISOString().split('T')[0];
  }

  function formatDateHebrew(dateStr) {
    // "2026-03-17" → "17/03/2026"
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function addOneDay(dateStr) {
    // Advance by exactly one day, timezone-safe
    const d = new Date(dateStr + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    return d.toISOString().split('T')[0];
  }

  function updateActiveDateDisplay() {
    document.getElementById('activeDateDisplay').textContent =
      activeTrackingDate ? formatDateHebrew(activeTrackingDate) : '—';
  }

  // ─── Unsaved changes detection ────────────────────────────────
  function getCurrentUIState() {
    // Collect checked items, sort by name, then stringify — fully order-independent
    const entries = [];
    getAllRows().forEach(row => {
      if (row._cb && row._cb.checked && row._name) {
        entries.push([row._name, parseFloat(row._qty.value) || 1]);
      }
    });
    entries.sort((a, b) => a[0].localeCompare(b[0]));
    return JSON.stringify(entries);
  }

  function updateSnapshot() {
    savedSnapshot = getCurrentUIState();
  }

  function hasUnsavedChanges() {
    return getCurrentUIState() !== savedSnapshot;
  }

  // ─── Unsaved changes modal ────────────────────────────────────
  function showUnsavedModal() {
    return new Promise(resolve => {
      modalResolve = resolve;
      document.getElementById('unsavedModal').style.display = 'block';
    });
  }

  function modalRespond(choice) {
    document.getElementById('unsavedModal').style.display = 'none';
    if (modalResolve) { modalResolve(choice); modalResolve = null; }
  }

  function showFinalizeModal() {
    return new Promise(resolve => {
      finalizeModalResolve = resolve;
      document.getElementById('finalizeModal').style.display = 'block';
    });
  }

  function finalizeModalRespond(choice) {
    document.getElementById('finalizeModal').style.display = 'none';
    if (finalizeModalResolve) { finalizeModalResolve(choice); finalizeModalResolve = null; }
  }

  // ─── Date picker ──────────────────────────────────────────────
  function openDatePicker() {
    const picker = document.getElementById('datePicker');
    picker.value = activeTrackingDate || '';
    picker.showPicker();
  }

  async function onDatePickerChange(value) {
    if (value && value !== activeTrackingDate) {
      await requestDateSwitch(value);
    }
  }

  async function requestDateSwitch(newDate) {
    if (hasUnsavedChanges()) {
      const choice = await showUnsavedModal();
      if (choice === 'cancel') return;
      if (choice === 'save') await saveAllRows();
    }

    // Switch to the new date
    activeTrackingDate = newDate;
    updateActiveDateDisplay();

    // Persist as the user's active tracking day
    await db.from('user_tracking_state').upsert({
      user_id:               currentUser.id,
      current_tracking_date: activeTrackingDate,
    });

    // Load data for the new date and rebuild the list
    await loadTodayEntries();
    buildList();
    updateTotal();
  }

  // ─── Screen management ────────────────────────────────────────
  function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
  function hideLoading()  { document.getElementById('loadingOverlay').style.display = 'none';  }

  function showAuth() {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display  = 'none';
    hideLoading();
  }

  function showApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').style.display  = 'block';
    document.getElementById('userEmail').textContent = currentUser.email;
    hideLoading();
  }

  // ─── Auth ────────────────────────────────────────────────────
  function clearAuthMessages() {
    document.getElementById('authError').textContent   = '';
    document.getElementById('authSuccess').textContent = '';
  }

  async function signUp() {
    clearAuthMessages();
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const { error } = await db.auth.signUp({ email, password });
    if (error) {
      document.getElementById('authError').textContent = error.message;
    } else {
      document.getElementById('authSuccess').textContent = 'נשלח מייל אישור — אשר ואז התחבר.';
    }
  }

  async function signIn() {
    clearAuthMessages();
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      document.getElementById('authError').textContent = error.message;
    }
  }

  async function signOut() {
    await db.auth.signOut();
  }

  // ─── Profile (calorie target) ─────────────────────────────────
  async function loadProfile() {
    const { data } = await db
      .from('profiles')
      .select('daily_calorie_target')
      .eq('id', currentUser.id)
      .single();

    if (data) {
      document.getElementById('targetInput').value = data.daily_calorie_target;
    } else {
      await db.from('profiles').insert({ id: currentUser.id, daily_calorie_target: 2300 });
      document.getElementById('targetInput').value = 2300;
    }
  }

  function onTargetChange() {
    updateTotal();
    clearTimeout(targetSaveTimer);
    targetSaveTimer = setTimeout(async () => {
      const val = parseInt(document.getElementById('targetInput').value) || 2300;
      await db.from('profiles').upsert({ id: currentUser.id, daily_calorie_target: val });
    }, 800);
  }

  // ─── Tracking state (active day) ──────────────────────────────
  async function loadTrackingState() {
    const { data } = await db
      .from('user_tracking_state')
      .select('current_tracking_date')
      .eq('user_id', currentUser.id)
      .single();

    if (data) {
      activeTrackingDate = data.current_tracking_date;
    } else {
      // Brand-new user: their first active day is today's real date
      activeTrackingDate = getRealToday();
      await db.from('user_tracking_state').insert({
        user_id:               currentUser.id,
        current_tracking_date: activeTrackingDate,
      });
    }

    updateActiveDateDisplay();
  }

  // ─── Daily food entries ───────────────────────────────────────
  async function loadTodayEntries() {
    const { data } = await db
      .from('daily_food_entries')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('date',    activeTrackingDate);   // ← active day, not clock

    todayEntries = {};
    if (data) {
      data.forEach(entry => { todayEntries[entry.food_name] = entry; });
    }
  }

  async function upsertEntry(foodName, calPerUnit, qty) {
    await db.from('daily_food_entries').upsert(
      {
        user_id:           currentUser.id,
        date:              activeTrackingDate,   // ← active day
        food_name:         foodName,
        calories_per_unit: Math.round(calPerUnit),
        quantity:          qty,
      },
      { onConflict: 'user_id,date,food_name' }
    );
  }

  async function deleteEntry(foodName) {
    await db.from('daily_food_entries')
      .delete()
      .eq('user_id',   currentUser.id)
      .eq('date',      activeTrackingDate)   // ← active day
      .eq('food_name', foodName);
  }

  // ─── Save / Finalize / Reset ──────────────────────────────────

  // Shared save logic: write checked items, remove previously-saved items that are now unchecked.
  async function saveAllRows() {
    // 1. Collect all checked items (use a Map so duplicate names don't conflict)
    const checkedItems = new Map(); // food_name → { cal, qty }
    for (const row of getAllRows()) {
      if (row._cb && row._cb.checked && row._name) {
        const q = parseFloat(row._qty.value) || 1;
        checkedItems.set(row._name, { cal: row._cal, qty: q });
      }
    }

    const ops = [];

    // 2. Upsert every checked item
    for (const [name, { cal, qty }] of checkedItems) {
      ops.push(upsertEntry(name, cal, qty));
    }

    // 3. Delete only items that WERE in the DB and are now unchecked
    //    (never delete based on unchecked UI rows that were never saved)
    for (const name of Object.keys(todayEntries)) {
      if (!checkedItems.has(name)) {
        ops.push(deleteEntry(name));
      }
    }

    await Promise.all(ops);

    // 4. Keep todayEntries in sync so subsequent saves are accurate
    todayEntries = {};
    for (const [name, { cal, qty }] of checkedItems) {
      todayEntries[name] = { food_name: name, calories_per_unit: cal, quantity: qty };
    }

    // 5. Update snapshot — UI is now in sync with DB
    updateSnapshot();
  }

  // "שמור" button
  async function saveProgress() {
    const btn = document.getElementById('btnSave');
    btn.disabled    = true;
    btn.textContent = 'שומר...';
    await saveAllRows();
    btn.textContent = 'נשמר ✓';
    setTimeout(() => {
      btn.disabled    = false;
      btn.textContent = 'שמור';
    }, 2000);
  }

  // "סיימתי להיום, עבור ליום הבא"
  async function finalizeDay() {
    if (hasUnsavedChanges()) {
      // Unsaved changes: show dedicated modal
      const choice = await showFinalizeModal();
      if (choice === 'cancel') return;
      if (choice === 'save') await saveAllRows();
      // 'skip' → finalize using current UI total, without touching food entries
    }

    const btn = document.getElementById('btnFinalize');
    btn.disabled = true;

    const total   = getCurrentTotal();
    const target  = parseInt(document.getElementById('targetInput').value) || 0;
    const balance = target - total;

    // 3. Save final summary for this day
    await db.from('daily_summaries').upsert(
      {
        user_id:          currentUser.id,
        tracking_date:    activeTrackingDate,
        total_calories:   total,
        calorie_balance:  balance,
        status:           'completed',
      },
      { onConflict: 'user_id,tracking_date' }
    );

    // 4. Advance the active tracking date by exactly one day
    activeTrackingDate = addOneDay(activeTrackingDate);
    await db.from('user_tracking_state').upsert({
      user_id:               currentUser.id,
      current_tracking_date: activeTrackingDate,
    });

    updateActiveDateDisplay();

    // 5. Reload the food list for the new (empty) day
    todayEntries = {};
    buildList();
    updateTotal();

    btn.disabled = false;
  }

  // "אפס יום" — clears all food entries for the active day
  async function resetDay() {
    if (!confirm('למחוק את כל הרשומות של היום הפעיל?')) return;

    await db.from('daily_food_entries')
      .delete()
      .eq('user_id', currentUser.id)
      .eq('date',    activeTrackingDate);   // ← active day

    getAllRows().forEach(row => {
      if (row._cb)  { row._cb.checked = false; row.classList.add('unchecked'); }
      if (row._qty) row._qty.value = 1;
    });
    updateTotal();
  }

  // ─── Build the food list ──────────────────────────────────────
  function buildList() {
    const container = document.getElementById('foodList');
    container.innerHTML = '';

    foods.forEach((food, index) => {
      const saved = todayEntries[food.name];
      container.appendChild(createFoodRow(food, index, saved));
    });

    // Custom items from DB that are not in the predefined list
    const predefined = new Set(foods.map(f => f.name));
    Object.values(todayEntries).forEach(entry => {
      if (!predefined.has(entry.food_name)) {
        const food = { name: entry.food_name, cal: entry.calories_per_unit };
        container.appendChild(createFoodRow(food, 'c_' + entry.id, entry));
      }
    });

    updateTotal();
    updateSnapshot(); // UI now reflects DB state
  }

  function createFoodRow(food, index, savedEntry) {
    const row = document.createElement('div');
    row.className = 'food-item' + (savedEntry ? '' : ' unchecked');

    const cb = document.createElement('input');
    cb.type    = 'checkbox';
    cb.id      = 'cb_' + index;
    cb.checked = !!savedEntry;

    const label = document.createElement('label');
    label.htmlFor     = 'cb_' + index;
    label.className   = 'name';
    label.textContent = food.name;

    const badge = document.createElement('span');
    badge.className   = 'cal-badge';
    badge.textContent = food.cal + ' קל׳';

    const qty = document.createElement('input');
    qty.type  = 'number';
    qty.value = savedEntry ? savedEntry.quantity : 1;
    qty.min   = 0.1;
    qty.max   = 99;
    qty.step  = 1;

    cb.addEventListener('change', () => {
      row.classList.toggle('unchecked', !cb.checked);
      updateTotal();
    });

    qty.addEventListener('input', () => {
      updateTotal();
    });

    row.appendChild(cb);
    row.appendChild(label);
    row.appendChild(badge);
    row.appendChild(qty);

    row._cb   = cb;
    row._qty  = qty;
    row._cal  = food.cal;
    row._name = food.name;

    return row;
  }

  // ─── Custom item ──────────────────────────────────────────────
  function addCustomItem() {
    const nameEl = document.getElementById('customName');
    const calEl  = document.getElementById('customCal');
    const name   = nameEl.value.trim();
    const cal    = parseInt(calEl.value);

    if (!name || isNaN(cal) || cal < 0) {
      alert('נא למלא שם ומספר קלוריות תקין.');
      return;
    }

    const row = createFoodRow({ name, cal }, 'custom_' + Date.now(), null);
    document.getElementById('foodList').appendChild(row);

    nameEl.value = '';
    calEl.value  = '';
  }

  // ─── Total calculation ────────────────────────────────────────
  function getAllRows() {
    return Array.from(document.querySelectorAll('.food-item'));
  }

  function getCurrentTotal() {
    let total = 0;
    getAllRows().forEach(row => {
      if (row._cb && row._cb.checked) {
        total += row._cal * (parseFloat(row._qty.value) || 1);
      }
    });
    return Math.round(total);
  }

  function updateTotal() {
    const total     = getCurrentTotal();
    const target    = parseInt(document.getElementById('targetInput').value) || 0;
    const remaining = target - total;

    document.getElementById('totalDisplay').textContent = total;
    const remEl = document.getElementById('remainingDisplay');
    remEl.textContent = Math.round(remaining);
    remEl.classList.toggle('negative', remaining < 0);
  }

  // ─── App init ─────────────────────────────────────────────────
  async function loadAndShowApp() {
    await loadProfile();
    await loadTrackingState();    // sets activeTrackingDate
    await loadTodayEntries();     // uses activeTrackingDate
    buildList();
    showApp();
  }

  async function init() {
    try {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        currentUser = session.user;
        await loadAndShowApp();
      } else {
        showAuth();
      }
    } catch (err) {
      console.error('Init error:', err);
      showAuth();
    }

    db.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session && !currentUser) {
        currentUser = session.user;
        showLoading();
        await loadAndShowApp();
      } else if (event === 'SIGNED_OUT') {
        currentUser        = null;
        activeTrackingDate = null;
        todayEntries       = {};
        showAuth();
      }
    });
  }

  init();

</script>
</body>
</html>
