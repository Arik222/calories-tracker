function getRealToday() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateHebrew(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function addOneDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + 1);
  const ny = dt.getFullYear();
  const nm = String(dt.getMonth() + 1).padStart(2, '0');
  const nd = String(dt.getDate()).padStart(2, '0');
  return `${ny}-${nm}-${nd}`;
}

function calcBalance(target, total, burned) {
  return target - total + burned;
}

function convertHeight(value, unit) {
  if (!value) return null;
  return unit === 'inch' ? Math.round(value * 2.54 * 10) / 10 : value;
}

function convertWeight(value, unit) {
  if (!value) return null;
  return unit === 'lb' ? Math.round(value * 0.453592 * 10) / 10 : value;
}

//  MODULE 1 — Date Utilities
// ─────────────────────────────────────────────────────────────
QUnit.module('Date Utilities', () => {

  QUnit.test('formatDateHebrew: formats YYYY-MM-DD to DD/MM/YYYY', assert => {
    assert.strictEqual(formatDateHebrew('2026-03-25'), '25/03/2026');
    assert.strictEqual(formatDateHebrew('2026-01-01'), '01/01/2026');
    assert.strictEqual(formatDateHebrew('2026-12-31'), '31/12/2026');
    assert.strictEqual(formatDateHebrew(''), '', 'empty string returns empty');
    assert.strictEqual(formatDateHebrew(null), '', 'null returns empty');
  });

  QUnit.test('addOneDay: advances by exactly one day', assert => {
    assert.strictEqual(addOneDay('2026-03-25'), '2026-03-26', 'normal day');
    assert.strictEqual(addOneDay('2026-03-31'), '2026-04-01', 'month boundary');
    assert.strictEqual(addOneDay('2026-12-31'), '2027-01-01', 'year boundary');
    assert.strictEqual(addOneDay('2026-02-28'), '2026-03-01', 'non-leap Feb');
    assert.strictEqual(addOneDay('2024-02-28'), '2024-02-29', 'leap year Feb');
    assert.strictEqual(addOneDay('2024-02-29'), '2024-03-01', 'leap day');
  });

  QUnit.test('getRealToday: returns valid YYYY-MM-DD string', assert => {
    const today = getRealToday();
    assert.ok(/^\d{4}-\d{2}-\d{2}$/.test(today), 'matches YYYY-MM-DD format');
    const parts = today.split('-');
    assert.ok(parseInt(parts[0]) >= 2024, 'year is plausible');
    assert.ok(parseInt(parts[1]) >= 1 && parseInt(parts[1]) <= 12, 'month in range');
    assert.ok(parseInt(parts[2]) >= 1 && parseInt(parts[2]) <= 31, 'day in range');
  });

  QUnit.test('formatDateHebrew and addOneDay roundtrip', assert => {
    const start  = '2026-03-25';
    const next   = addOneDay(start);
    const display = formatDateHebrew(next);
    assert.strictEqual(display, '26/03/2026');
  });

});

QUnit.module('Calorie Balance', () => {

  QUnit.test('basic balance: target - consumed + burned', assert => {
    assert.strictEqual(calcBalance(2300, 0, 0),    2300, 'nothing eaten');
    assert.strictEqual(calcBalance(2300, 2300, 0),    0, 'exactly on target');
    assert.strictEqual(calcBalance(2300, 1500, 300), 1100, 'under + exercise');
    assert.strictEqual(calcBalance(2300, 2500, 0),  -200, 'over target');
    assert.strictEqual(calcBalance(2300, 2500, 300),  100, 'over but exercise saves it');
  });

  QUnit.test('balance of 0 is treated as success (not failure)', assert => {
    const pool = pickMessage(0, 'male');
    assert.strictEqual(pool, MESSAGES.male.success, 'balance=0 → success pool');
  });

  QUnit.test('negative balance → failure pool', assert => {
    assert.strictEqual(pickMessage(-1, 'male'),   MESSAGES.male.failure);
    assert.strictEqual(pickMessage(-500, 'female'), MESSAGES.female.failure);
  });

  QUnit.test('edge: very large surplus/deficit', assert => {
    assert.strictEqual(calcBalance(2300, 0, 5000),  7300, 'huge exercise');
    assert.strictEqual(calcBalance(2300, 10000, 0), -7700, 'huge intake');
  });

});

// ─────────────────────────────────────────────────────────────
//  MODULE 5 — Security Scan (fetches index.html source)
// ─────────────────────────────────────────────────────────────
QUnit.module('Security Scan', hooks => {
  let src = '';

  hooks.before(async () => {
    try {
      const res = await fetch('/index.html');
      src = await res.text();
    } catch (e) {
      src = '';
    }
  });

  QUnit.test('index.html was loaded for scanning', assert => {
    assert.ok(src.length > 1000, `Loaded ${src.length} chars — run via http server, not file://`);
  });

  QUnit.test('no eval() usage', assert => {
    const matches = [...src.matchAll(/\beval\s*\(/g)];
    assert.strictEqual(matches.length, 0, `Found ${matches.length} eval() calls`);
  });

  QUnit.test('no document.write() usage', assert => {
    const matches = [...src.matchAll(/document\.write\s*\(/g)];
    assert.strictEqual(matches.length, 0, `Found ${matches.length} document.write() calls`);
  });

  QUnit.test('no Function() constructor usage', assert => {
    const matches = [...src.matchAll(/new\s+Function\s*\(/g)];
    assert.strictEqual(matches.length, 0, `Found ${matches.length} new Function() calls`);
  });

  QUnit.test('no setTimeout/setInterval with string argument', assert => {
    // setTimeout("...", n) or setInterval("...", n) — dangerous pattern
    const matches = [...src.matchAll(/set(?:Timeout|Interval)\s*\(\s*['"]/g)];
    assert.strictEqual(matches.length, 0, `Found ${matches.length} timer-with-string calls`);
  });

  QUnit.test('innerHTML never assigned with user-derived runtime variable', assert => {
    // Allowed: innerHTML = '' or innerHTML = '<literal HTML'
    // Dangerous: innerHTML = someVariable  or  innerHTML = `...${var}...`
    const lines = src.split('\n');
    const violations = [];
    lines.forEach((line, i) => {
      // Match: .innerHTML = something that is NOT '' or literal HTML string starting with <
      if (/\.innerHTML\s*=/.test(line)) {
        // Allow: .innerHTML = '' or .innerHTML = "..." or .innerHTML = '<...'
        const rhs = line.replace(/.*\.innerHTML\s*=\s*/, '').trim();
        const isSafeLiteral = /^(['"`])\s*\1/.test(rhs)         // empty string ''
                           || /^['"`]</.test(rhs)                // literal HTML string
                           || /^'[^']*'/.test(rhs)               // any short string literal
                           || /^"[^"]*"/.test(rhs);              // any short string literal
        if (!isSafeLiteral) {
          violations.push(`Line ${i + 1}: ${line.trim()}`);
        }
      }
    });
    assert.strictEqual(violations.length, 0,
      violations.length ? 'Potential XSS:\n' + violations.join('\n') : 'OK');
  });

  QUnit.test('Supabase URL uses HTTPS', assert => {
    // Check the inline constant directly — does not depend on async fetch
    const urlMatch = src.match(/const\s+SUPABASE_URL\s*=\s*['"]([^'"]+)['"]/);
    assert.ok(urlMatch, 'SUPABASE_URL constant found in source');
    if (urlMatch) {
      const url = urlMatch[1];
      assert.ok(url.startsWith('https://'), `SUPABASE_URL is "${url}" — must start with https://`);
      assert.ok(url.includes('.supabase.co'), `SUPABASE_URL "${url}" points to supabase.co`);
    }
  });

  QUnit.test('no hardcoded passwords or secret keys in source', assert => {
    // Look for suspicious patterns (not the anon key which is public by design)
    const serviceRolePattern = /service_role/i;
    const passwordInCode     = /password\s*=\s*['"][^'"]{6,}/;
    assert.notOk(serviceRolePattern.test(src), 'no service_role key in source');
    // Exclude auth form password field assignments from this check
    const srcNoForm = src.replace(/<input[^>]*type="password"[^>]*>/g, '');
    const passwordMatches = [...srcNoForm.matchAll(/(?<!=)\bpassword\b\s*=\s*['"][^'"]{6,}/g)];
    assert.strictEqual(passwordMatches.length, 0,
      passwordMatches.length ? 'Possible hardcoded password found' : 'OK');
  });

  QUnit.test('auth screen and app screen are separate and gated', assert => {
    assert.ok(/id="authScreen"/.test(src), 'authScreen element exists');
    assert.ok(/id="appScreen"/.test(src),  'appScreen element exists');
    assert.ok(/display:none/.test(src) || /display: none/.test(src), 'elements start hidden');
    assert.ok(/db\.auth\.getUser\(\)/.test(src), 'uses getUser() for server-side auth check');
    assert.ok(/showAuth\(\)/.test(src), 'showAuth() called on auth failure');
  });

  QUnit.test('no window.location.hash or query-param injection vectors', assert => {
    assert.notOk(/location\.hash/.test(src),          'no hash reading');
    assert.notOk(/location\.search/.test(src),         'no query string reading');
    assert.notOk(/URLSearchParams/.test(src),          'no URLSearchParams');
  });

  QUnit.test('user data written via textContent, not innerHTML', assert => {
    // Check that currentUser.email is set via textContent
    assert.ok(/textContent\s*=\s*currentUser\.email/.test(src) ||
              /textContent.*userEmail/.test(src) ||
              /settingsEmail.*textContent/.test(src),
      'email written via textContent');
    // No innerHTML assignment of currentUser properties
    assert.notOk(/\.innerHTML\s*=\s*currentUser/.test(src),
      'currentUser not written via innerHTML');
  });

});

  QUnit.test('saveAllRows calls recalcSummaryForDate (not direct upsert)', assert => {
    assert.ok(src.length > 1000, 'index.html loaded');
    assert.ok(/saveAllRows[\s\S]{0,3000}recalcSummaryForDate/.test(src),
      'saveAllRows delegates summary update to recalcSummaryForDate');
    // Must NOT directly upsert daily_summaries inside saveAllRows
    const saveAllRowsBody = src.match(/async function saveAllRows[\s\S]+?(?=\n  \/\/ .{0,40}\n  (?:async )?function)/)?.[0] || '';
    assert.notOk(/daily_summaries.*upsert/.test(saveAllRowsBody),
      'saveAllRows does not directly upsert daily_summaries');
  });

  QUnit.test('finalizeDay calls recalcSummaryForDate with markCompleted=true', assert => {
    assert.ok(src.length > 1000, 'index.html loaded');
    assert.ok(/finalizeDay[\s\S]{0,1000}recalcSummaryForDate\s*\(\s*activeTrackingDate\s*,\s*true\s*\)/.test(src),
      'finalizeDay calls recalcSummaryForDate(activeTrackingDate, true)');
  });

  QUnit.test('finalizeDay does not use getCurrentTotal() for summary', assert => {
    assert.ok(src.length > 1000, 'index.html loaded');
    const finalizeDayBody = src.match(/async function finalizeDay[\s\S]+?(?=\n  \/\/ .{0,40}\n  (?:async )?function)/)?.[0] || '';
    assert.notOk(/getCurrentTotal\s*\(\s*\)/.test(finalizeDayBody),
      'finalizeDay does not derive summary from UI-only getCurrentTotal()');
  });

  QUnit.test('upsertEntry stores calories_per_unit without integer rounding', assert => {
    assert.ok(src.length > 1000, 'index.html loaded');
    // Must not have Math.round(calPerUnit) in upsertEntry
    const upsertBody = src.match(/async function upsertEntry[\s\S]+?\}/)?.[0] || '';
    assert.notOk(/Math\.round\s*\(\s*calPerUnit\s*\)/.test(upsertBody),
      'upsertEntry does not Math.round calPerUnit');
    assert.ok(/calories_per_unit\s*:\s*calPerUnit/.test(upsertBody),
      'upsertEntry stores raw calPerUnit value');
  });

  QUnit.test('decimal calories_per_unit preserved through sum (no integer drift)', assert => {
    // Simulate: 5 entries of 1.86 cal × 1 qty
    const entries = Array(5).fill({ calories_per_unit: 1.86, quantity: 1 });
    const total = Math.round(entries.reduce((s, e) => s + e.calories_per_unit * e.quantity, 0));
    assert.strictEqual(total, 9, '5 × 1.86 rounds to 9 (not 5 due to premature int rounding)');
  });

  QUnit.test('repeated saves do not drift: same inputs produce same stored value', assert => {
    // If calPerUnit is stored as-is and re-read, applying it multiple times must not drift
    const calPerUnit = 1.86;
    const stored     = calPerUnit;           // no Math.round at write time
    const readBack   = stored;               // DB returns exactly what was stored
    assert.strictEqual(readBack, 1.86, 'value round-trips without drift');
  });

  QUnit.test('balance formula target-total+burned is consistent across all call sites', assert => {
    assert.ok(src.length > 1000, 'index.html loaded');
    const matches = [...src.matchAll(/target\s*-\s*total\s*\+\s*burned/g)];
    assert.ok(matches.length >= 2,
      `Formula appears ${matches.length} time(s) — expected ≥2 (recalcSummaryForDate, applyItemEdit)`
    );
  });

  QUnit.test('recalcAllSummaries deletes orphaned summaries when entries=0', assert => {
    assert.ok(src.length > 1000, 'index.html loaded');
    assert.ok(/recalcAllSummaries[\s\S]{0,3000}toDelete/.test(src),
      'recalcAllSummaries separates dates with no entries into toDelete for deletion'
    );
  });

});

// ─────────────────────────────────────────────────────────────
//  MODULE 8 — User Deletion Cleanup
// ─────────────────────────────────────────────────────────────
QUnit.module('User Deletion Cleanup', hooks => {
  let appSrc   = '';
  let sqlSrc   = '';

  hooks.before(async () => {
    try { appSrc = await (await fetch('/index.html')).text();                     } catch (e) { appSrc = ''; }
    try { sqlSrc = await (await fetch('/supabase-migration-cascade.sql')).text(); } catch (e) { sqlSrc = ''; }
  });

  QUnit.test('migration file loaded', assert => {
    assert.ok(sqlSrc.length > 100, 'supabase-migration-cascade.sql is present and non-empty');
  });

  const USER_TABLES = [
    'daily_food_entries',
    'daily_exercise_entries',
    'daily_summaries',
    'user_tracking_state',
    'calorie_target_history',
    'user_custom_foods',
    'profiles',
  ];

  USER_TABLES.forEach(table => {
    QUnit.test(`migration adds ON DELETE CASCADE for ${table}`, assert => {
      assert.ok(sqlSrc.length > 100, 'migration file loaded');
      // Either the table has a cascade FK added in the migration,
      // or it was already covered in the original setup (profiles, daily_food_entries,
      // daily_summaries, user_tracking_state all had cascade from the start).
      const coveredByOriginalSetup = ['profiles', 'daily_food_entries', 'daily_summaries', 'user_tracking_state'];
      if (coveredByOriginalSetup.includes(table)) {
        assert.ok(true, `${table} has ON DELETE CASCADE from original setup`);
      } else {
        assert.ok(
          new RegExp(`alter table ${table}[\\s\\S]{0,300}on delete cascade`).test(sqlSrc),
          `migration adds ON DELETE CASCADE FK to ${table}`
        );
      }
    });
  });

  QUnit.test('delete_my_account() RPC explicitly deletes from all 7 tables', assert => {
    assert.ok(sqlSrc.length > 100, 'migration file loaded');
    USER_TABLES.forEach(table => {
      assert.ok(
        new RegExp(`delete from ${table}`).test(sqlSrc),
        `delete_my_account deletes from ${table}`
      );
    });
  });

  QUnit.test('app deleteAccount() calls the delete_my_account RPC', assert => {
    assert.ok(appSrc.length > 1000, 'index.html loaded');
    assert.ok(/rpc\s*\(\s*['"]delete_my_account['"]\s*\)/.test(appSrc),
      'deleteAccount() calls db.rpc("delete_my_account")');
  });

  QUnit.test('delete_my_account RPC is SECURITY DEFINER', assert => {
    assert.ok(sqlSrc.length > 100, 'migration file loaded');
    assert.ok(/security definer/i.test(sqlSrc),
      'RPC is defined with SECURITY DEFINER (required to delete auth.users)');
  });

  QUnit.test('delete_my_account RPC guards against unauthenticated calls', assert => {
    assert.ok(sqlSrc.length > 100, 'migration file loaded');
    assert.ok(/auth\.uid\(\)/.test(sqlSrc),
      'RPC calls auth.uid() to identify the caller');
    assert.ok(/if uid is null/i.test(sqlSrc) || /uid is null/i.test(sqlSrc),
      'RPC raises exception if uid is null (not authenticated)');
  });

});
